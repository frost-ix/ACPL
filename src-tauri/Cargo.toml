[package]
name = "acpl"
version = "2.0.0"
description = "ACPL - Multi-folder OS Shell Integration supporting Anthropic Claude, Antigravity, and Codex CLI"
authors = ["성현우"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.5", features = [] }

[dependencies]
tauri = { version = "2.2.0", features = [] }
tauri-plugin-dialog = "2.2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
portable-pty = "0.8"
tokio = { version = "1", features = ["full"] }
parking_lot = "0.12"
dirs = "5.0"

# Same versions Tauri already uses (see Cargo.lock): only to switch off WebView2's browser
# shortcuts (reload / find / print / zoom / devtools) on the main webview.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows = "0.61"
