<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ACPL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&family=Noto+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="vendor/acl_icon.png">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="vendor/xterm.css">
</head>
<body class="theme-dark">
  <!-- Custom title bar (window decorations are off). Every non-button part is a drag region;
       double click toggles maximize. Buttons: Ubuntu-style round controls on the right. -->
  <header class="titlebar" id="titlebar" data-tauri-drag-region>
    <!-- Left: actions on the current session (enabled while one is running) -->
    <div class="titlebar-side titlebar-actions" data-tauri-drag-region>
      <button class="tb-action tb-extract" id="btn-extract-chat" tabindex="-1" disabled>📝 대화 추출</button>
      <button class="tb-action tb-report" id="btn-export-report" tabindex="-1" disabled>📄 보고서 출력</button>
    </div>
    <div class="titlebar-title" data-tauri-drag-region>
      <img class="titlebar-icon" src="vendor/acl_icon.png" alt="" data-tauri-drag-region>
      <span id="titlebar-text" data-tauri-drag-region>ACPL</span>
    </div>
    <div class="titlebar-side titlebar-controls" data-tauri-drag-region>
      <button class="wc-btn" id="wc-minimize" title="최소화" tabindex="-1">
        <svg viewBox="0 0 10 10"><path d="M2 5.5h6"/></svg>
      </button>
      <button class="wc-btn" id="wc-maximize" title="최대화" tabindex="-1">
        <svg class="wc-icon-max" viewBox="0 0 10 10"><rect x="2" y="2" width="6" height="6" rx="0.6"/></svg>
        <svg class="wc-icon-restore" viewBox="0 0 10 10"><rect x="1.8" y="3.4" width="4.8" height="4.8" rx="0.5"/><path d="M3.6 3.4V2.2h4.2v4.2H6.6"/></svg>
      </button>
      <button class="wc-btn wc-close" id="wc-close" title="닫기" tabindex="-1">
        <svg viewBox="0 0 10 10"><path d="M2.6 2.6l4.8 4.8M7.4 2.6l-4.8 4.8"/></svg>
      </button>
    </div>
  </header>

  <div class="app-container">
    <!-- Sidebar Controls & Dynamic Folder List -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="header-title-group">
          <h2>⚡ AI CLI Launcher</h2>
          <div class="subtitle">OS Shell Integration</div>
        </div>
        <button id="btn-toggle-sidebar" class="btn-toggle-sidebar" title="사이드바 토글">◀</button>
      </div>

      <button id="btn-add-folder" class="btn-add-folder">
        <span>➕</span>
        <span class="sidebar-text">작업 폴더 추가</span>
      </button>

      <button id="btn-new-group" class="btn-open-switcher btn-new-group" title="새 그룹 만들기">
        <span>🗂</span>
        <span class="sidebar-text"><span class="new-group-btn-label">새 그룹</span></span>
      </button>

      <button id="btn-open-switcher" class="btn-open-switcher" title="폴더 빠른 전환 (Ctrl+K)">
        <span>🔍</span>
        <span class="sidebar-text"><span class="switcher-btn-label">폴더 찾기</span><kbd>Ctrl+K</kbd></span>
      </button>

      <!-- Dynamic Folder List -->
      <div class="folder-list-container" id="folder-list-container">
        <!-- Folder sections / cards rendered by modules/ui.js -->
      </div>

      <!-- Sidebar Footer -->
      <div class="sidebar-footer">

        <!-- 2. Theme & Language Toggle Group -->
        <div class="theme-toggle-group">
          <button id="btn-theme-toggle" class="btn-theme-toggle" title="테마 전환">
            <span id="theme-icon">🌙</span>
            <span id="theme-text" class="sidebar-text">Dark 모드</span>
          </button>
          <select id="select-lang" class="select-lang" title="언어 변경 / Language">
            <option value="ko">ko</option>
            <option value="en">en</option>
          </select>
        </div>

        <!-- 3. Save Button -->
        <button id="btn-save" class="btn-save-bottom" title="설정 저장">
          <span>💾</span>
          <span class="sidebar-text">설정 저장</span>
        </button>
      </div>
    </aside>

    <!-- Resizer Handle -->
    <div class="sidebar-resizer" id="sidebar-resizer"></div>

    <!-- PowerShell Terminal Area -->
    <main class="terminal-area">
      <!-- Session panes (panes.js): each pane header shows the session and its
           extract / report / browser buttons; running sessions are listed in the sidebar -->

      <div class="terminals-wrapper" id="terminals-wrapper">
        <!-- Xterm containers dynamically created per folder session -->
      </div>

      <!-- VS Code style usage status bar -->
      <footer id="usage-status-bar" class="status-bar"></footer>
    </main>
  </div>

  <!-- Confirm Close Session Modal -->
  <div id="confirm-modal" class="modal-overlay hidden">
    <div class="modal-card">
      <div class="modal-icon">⚠️</div>
      <div class="modal-title">CLI 세션 종료 확인</div>
      <div class="modal-desc" id="modal-session-desc">실행 중인 세션을 종료하시겠습니까?</div>
      <div class="modal-actions">
        <button id="modal-btn-confirm" class="btn-modal-yes">종료</button>
        <button id="modal-btn-cancel" class="btn-modal-no">취소</button>
      </div>
    </div>
  </div>

  <script src="vendor/xterm.js"></script>
  <script src="vendor/addon-fit.js"></script>
  <script src="tauri-bridge.js"></script>
  <script type="module" src="modules/app.js"></script>
</body>
</html>
